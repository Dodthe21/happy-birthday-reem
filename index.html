<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <title>Khofash's Birthday</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <link rel="icon" href="Fly Bats logo.png">

</head>
<body>
    <h1>
      Blow the candle</h1>
     <div class="glow" id="glow"></div>
     <div id="candle">
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div id="top">
         <div class="smoke"></div>
         <div class="smoke"></div>
         <div class="smoke"></div>
         <div id="knot"></div>
         <div class="burn" id="flame"></div>
       </div>
     </div>
<div id="extra-content" style="display:none; text-align:center; margin:25px auto; color:white;">
  <button id="memories-btn">Open your memories</button>
  <div id="memories" style="display:none; margin:15px;">
    <div class="photo-gallery">
  <img src="photo1.jpg" alt="Memory 1">
  <img src="photo2.jpg" alt="Memory 2">
  <img src="photo3.jpg" alt="Memory 3">
  <img src="photo4.jpg" alt="Memory 4">
  <img src="photo5.jpg" alt="Memory 5">
</div>
  </div>

  <button id="secret-btn">One last thing</button>
  <p id="secret-message" style="display:none;">
    You're 20 now. Act like it. Anyway, happy birthday Reem.
  </p>
</div>

<script>
document.getElementById("memories-btn").onclick = function() {
  document.getElementById("memories").style.display = "block";
};

document.getElementById("secret-btn").onclick = function() {
  document.getElementById("secret-message").style.display = "block";
};
</script>
</body>
</html>
