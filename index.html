<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:title" content="Happy Birthday Reem 🤍">
<meta property="og:image" content="https://dodthe21.github.io/happy-birthday-reem/Reem.jpg.PNG">
<meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <title>Happy Birthday Reem 🤍</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <link rel="icon" href="Fly Bats logo.png">
<style>
.photo-gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 15px;
}

.photo-gallery img {
  width: 42%;
  max-width: 180px;
  height: 150px;
  object-fit: cover;
  border-radius: 12px;
}
</style>

</head>
<body>
    <h1>
      Blow the candle</h1>
     <div class="glow" id="glow"></div>
     <div id="candle">
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div class="stripe"></div>
       <div id="top">
         <div class="smoke"></div>
         <div class="smoke"></div>
         <div class="smoke"></div>
         <div id="knot"></div>
         <div class="burn" id="flame"></div>
       </div>
     </div>
<div id="extra-content" style="text-align:center; margin:25px auto; color:white;">
  <button id="memories-btn">Open your memories</button>
  <div id="memories" style="display:none; margin:15px;">
    <div class="photo-gallery">
  <img src="./Photo1.jpg.JPG" alt="Memory 1">
  <img src="Photo2.jpg.JPG" alt="Memory 2">
  <img src="Photo4.jpg.HEIC" alt="Memory 4">
  <img src="Photo5.jpg.JPG" alt="Memory 5">
</div>
  </div>

  <button id="secret-btn">One last thing</button>
  <p id="secret-message" style="display:none;">
    Those were the times u acted like a human in ur 19, so now is my turn. Check @HBDjohnsmith on X.
  </p>
</div>

<script>
document.getElementById("memories-btn").onclick = function() {
  document.getElementById("memories").style.display = "block";
};

document.getElementById("secret-btn").onclick = function() {
  document.getElementById("secret-message").style.display = "block";
};
</script>
</body>
</html>
